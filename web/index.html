<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1012" media="(prefers-color-scheme: dark)" />
    <title>TaxFax — Stop chasing. Start filing.</title>
    <meta
      name="description"
      content="TaxFax builds every client's document checklist from last year's return, chases them across email and SMS until it's complete, then names and files every upload for you."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      (() => {
        const stored = localStorage.getItem('taxfax.theme');
        const dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
