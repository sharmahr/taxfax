<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F9F8F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)" />
    <title>TaxFax — Stop chasing. Start filing.</title>
    <meta
      name="description"
      content="TaxFax builds every client's document checklist from last year's return, chases them across email and SMS until it's complete, then names and files every upload for you."
    />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="TaxFax" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TaxFax" />
    <meta property="og:url" content="https://taxfax.xyz/" />
    <meta property="og:title" content="TaxFax — Stop chasing. Start filing." />
    <meta
      property="og:description"
      content="Every client's document checklist, built from last year's return, then chased by email and text until it is complete."
    />
    <meta property="og:image" content="https://taxfax.xyz/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TaxFax — Stop chasing. Start filing." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      (() => {
        const stored = localStorage.getItem('taxfax.theme');
        const dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
